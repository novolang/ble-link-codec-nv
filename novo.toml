[package]
name        = "ble-link-codec-nv"
version     = "0.0.1"
description = "The Bluetooth LE link-layer packet codec with no radio: advertising PDUs and their AD structures, the CONNECT_IND payload, the data-channel header, the control PDUs, and the two channel-selection algorithms as pure functions.  Interface only — every body is a todo()."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `core`.  The link layer is the one place in a BLE stack where a radio
# is genuinely present, and this package is the half of it that is not:
# packets to and from bytes, and the channel arithmetic.  The timing,
# the antenna and the DMA stay in the controller.
layer       = "core"

category    = "networking"

tags        = ["bluetooth", "ble", "link-layer", "advertising", "codec", "sans-io", "channel-selection", "embedded"]
repository  = "https://github.com/novolang/ble-link-codec-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "Link-layer packets, without the radio that sends them"

[dependencies]
# None.  The link layer is the bottom of the stack: below it is a radio
# and above it is L2CAP, and a codec over `[u8]` needs neither.  That is
# what lets the same package sit in a controller and in a sniffer.
